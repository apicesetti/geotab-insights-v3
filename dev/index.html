<body>
<div id="gi3-root"><div class="splash">Esta página está pensada para abrirse como Add-In dentro de MyGeotab.</div></div>

<script src="mock-api.js"></script>
<script>
  // Arranque como lo haría MyGeotab
  // Simula el filtro de grupos de MyGeotab: ?grupos=gBit,gLiv
  var mgGroups = (new URLSearchParams(location.search).get("grupos") || "").split(",").filter(Boolean).map(function (id) { return { id: id }; });
  var mockState = { getGroupFilter: function () { return mgGroups.length ? mgGroups : [{ id: "GroupCompanyId" }]; } };
  var addin = geotab.addin.cesettiInsightsV3();
  addin.initialize(mockApi, mockState, function () { addin.focus(mockApi, mockState); });
  // Para probar cambios de filtro desde la consola: setGrupos("gBit")
  window.setGrupos = function (ids) { mgGroups = (ids || "").split(",").filter(Boolean).map(function (id) { return { id: id }; }); addin.focus(mockApi, mockState); };
</script>
</body>
